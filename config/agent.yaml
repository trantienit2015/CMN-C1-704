# Agent Manifest — AgentRegistry entry point
# AgentRegistry reads every key below at ROOT level. Nesting them under an
# `agent:` block makes them invisible to the registry: namespace and enabled
# fall back to defaults and name/version never resolve.
id: "CMN-C1-704"
name: "SlackWorkflowTriggerAgent"
namespace: "cmn"
version: "0.1.0"
enabled: true
category: "Cat 1"
industry: "CMN"

# Base pattern reference (L1-direct inheritance; not an import target)
base_type: "ToolCallingAgent"

# Entry point — a single dotted import path (module.Class), not a module:/class:
# split. AgentRegistry does class.rsplit(".", 1) to get (module, class_name).
class: "src.graph.graph.Graph"

# Security — automation-triggering agent; callers are internal systems/operators
required_trust_level: "INTERNAL"

# Compile-time gates. Both lists are declared explicitly.
# The three Azure OpenAI secrets back an OPTIONAL resolution enhancer: MainNode
# falls back to deterministic keyword resolution when no LLM is injected (see
# config/config.yaml). They are still declared here (not left empty) so the
# registry path resolves and injects a real client when the deployment has them
# provisioned. NOTE: AgentRegistry's require_at_compile() fails closed on any
# requires.secrets entry that is not actually provisioned in the target
# environment — verify all three are provisioned in STG before relying on the
# registry (non-standalone) invoke path; the standalone src/api/server.py path
# uses .get() and degrades gracefully either way.
requires:
  secrets:
    - AZURE_OPENAI_API_KEY
    - AZURE_OPENAI_ENDPOINT
    - AZURE_OPENAI_DEPLOYMENT
  extras:
    - openai

# Runtime parameters (max_retry, timeout_seconds) live in config/config.yaml.
# AgentRegistry loads that file separately and passes it as Graph(config=...).
